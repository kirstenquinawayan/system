<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin password recovery</title>
  <link rel="stylesheet" href="admin-operations.css?v=20261115">
  <script src="admin-password-reset.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar"><a class="brand" href="admin-login.html">OCWBS <span>Admin</span></a>
    <a class="button button-quiet" href="admin-login.html">Back to sign in</a></header>
  <main id="main" class="shell">
    <section class="card recovery-card">
      <p class="eyebrow">Account recovery</p>
      <h1 id="page-title">Forgot your password?</h1>
      <p id="page-description" class="muted">Enter your username or recovery email. For privacy, the response is the same whether or not an account matches.</p>
      <div id="recovery-notice" class="notice" role="status" aria-live="polite" hidden></div>
      <form id="request-form" class="stack">
        <label>Username or recovery email<input id="identifier" maxlength="254" autocomplete="username" required></label>
        <button class="button button-primary" type="submit">Send reset link</button>
      </form>
      <form id="reset-form" class="stack" hidden>
        <label>New password<input id="new-password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label>
        <label>Confirm password<input id="confirm-password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label>
        <button class="button button-primary" type="submit">Change password</button>
      </form>
    </section>
  </main>
</body>
</html>
